<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="avatarTitle avatarDesc">
  <title id="avatarTitle">Illustrated monogram avatar for Xiaoyu (Tom) Chen</title>
  <desc id="avatarDesc">An original geometric mark: a globe grid with a four-stop route arcing across it, and an X C monogram drawn in strokes.</desc>

  <defs>
    <linearGradient id="avBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e" />
      <stop offset="0.55" stop-color="#15304a" />
      <stop offset="1" stop-color="#11433f" />
    </linearGradient>
    <linearGradient id="avRoute" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b55c" />
      <stop offset="1" stop-color="#6fd6c4" />
    </linearGradient>
    <radialGradient id="avGlow" cx="0.3" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#5fb0c9" stop-opacity="0.35" />
      <stop offset="1" stop-color="#5fb0c9" stop-opacity="0" />
    </radialGradient>
    <clipPath id="avClip">
      <rect x="0" y="0" width="640" height="640" rx="96" ry="96" />
    </clipPath>
  </defs>

  <g clip-path="url(#avClip)">
    <rect x="0" y="0" width="640" height="640" fill="url(#avBg)" />
    <rect x="0" y="0" width="640" height="640" fill="url(#avGlow)" />

    <!-- globe grid: meridians and parallels on a sphere centred low-right -->
    <g fill="none" stroke="#9fd0dd" stroke-opacity="0.22" stroke-width="2">
      <circle cx="320" cy="330" r="238" />
      <circle cx="320" cy="330" r="178" stroke-opacity="0.14" />
      <ellipse cx="320" cy="330" rx="238" ry="78" />
      <ellipse cx="320" cy="330" rx="238" ry="158" stroke-opacity="0.16" />
      <ellipse cx="320" cy="330" rx="78" ry="238" />
      <ellipse cx="320" cy="330" rx="158" ry="238" stroke-opacity="0.16" />
      <line x1="320" y1="92" x2="320" y2="568" stroke-opacity="0.12" />
      <line x1="82" y1="330" x2="558" y2="330" stroke-opacity="0.12" />
    </g>

    <!-- the four-stop route, same idea as the Where I've been map -->
    <path d="M 148 236 Q 236 146, 324 224 T 506 352"
          fill="none" stroke="url(#avRoute)" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="15 19" opacity="0.92" />
    <g fill="#f6f2e8">
      <circle cx="148" cy="236" r="13" />
      <circle cx="324" cy="224" r="11" opacity="0.85" />
      <circle cx="421" cy="276" r="11" opacity="0.85" />
      <circle cx="506" cy="352" r="16" />
      <circle cx="506" cy="352" r="28" fill="none" stroke="#f6f2e8" stroke-width="4" opacity="0.55" />
    </g>

    <!-- X C monogram, drawn as strokes so it needs no font -->
    <g fill="none" stroke="#f6f2e8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 176 434 L 290 548" />
      <path d="M 290 434 L 176 548" />
      <path d="M 472 448 A 64 64 0 1 0 472 534" />
    </g>
  </g>

  <rect x="3" y="3" width="634" height="634" rx="94" ry="94" fill="none" stroke="#6fd6c4" stroke-opacity="0.35" stroke-width="6" />
</svg>
