<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="Seven speech bubbles, each holding a letter from a different writing system.">
  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17202e" />
      <stop offset="1" stop-color="#2a1f3d" />
    </linearGradient>
    <style>
      .lg-glyph {
        font-family: "Noto Sans", "Segoe UI", "Hiragino Sans", "Microsoft YaHei", sans-serif;
        font-size: 34px;
        font-weight: 600;
        fill: #141a24;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <rect width="600" height="280" fill="url(#lgBg)" />

  <!-- faint waveform, the sound of seven languages at once -->
  <g stroke="#8d7fd1" stroke-opacity="0.2" stroke-width="2" fill="none">
    <path d="M0 240 q25 -26 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" />
    <path d="M0 254 q18 -16 36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0" stroke-opacity="0.12" />
  </g>

  <!-- speech bubbles -->
  <g>
    <g transform="translate(78 92)">
      <rect x="-36" y="-30" width="72" height="60" rx="18" fill="#6fd6c4" />
      <path d="M-10 28 L-2 44 L8 28 Z" fill="#6fd6c4" />
      <text class="lg-glyph" x="0" y="0">中</text>
    </g>
    <g transform="translate(186 70)">
      <rect x="-32" y="-28" width="64" height="56" rx="17" fill="#f2b55c" />
      <path d="M-8 26 L0 41 L9 26 Z" fill="#f2b55c" />
      <text class="lg-glyph" x="0" y="0">A</text>
    </g>
    <g transform="translate(292 106)">
      <rect x="-32" y="-28" width="64" height="56" rx="17" fill="#e58f9c" />
      <path d="M-8 26 L0 41 L9 26 Z" fill="#e58f9c" />
      <text class="lg-glyph" x="0" y="0">ñ</text>
    </g>
    <g transform="translate(398 66)">
      <rect x="-32" y="-28" width="64" height="56" rx="17" fill="#8fb9ef" />
      <path d="M-8 26 L0 41 L9 26 Z" fill="#8fb9ef" />
      <text class="lg-glyph" x="0" y="0">é</text>
    </g>
    <g transform="translate(502 104)">
      <rect x="-32" y="-28" width="64" height="56" rx="17" fill="#c7b0f0" />
      <path d="M-8 26 L0 41 L9 26 Z" fill="#c7b0f0" />
      <text class="lg-glyph" x="0" y="0">ß</text>
    </g>
    <g transform="translate(240 186)">
      <rect x="-32" y="-28" width="64" height="56" rx="17" fill="#9fe0a8" />
      <path d="M-8 26 L0 41 L9 26 Z" fill="#9fe0a8" />
      <text class="lg-glyph" x="0" y="0">あ</text>
    </g>
    <g transform="translate(372 180)">
      <rect x="-32" y="-28" width="64" height="56" rx="17" fill="#f3c9a0" />
      <path d="M-8 26 L0 41 L9 26 Z" fill="#f3c9a0" />
      <text class="lg-glyph" x="0" y="0">ã</text>
    </g>
  </g>

  <!-- the trap -->
  <g transform="translate(96 206)">
    <rect x="-52" y="-20" width="104" height="40" rx="12" fill="none" stroke="#f2b55c" stroke-width="2" stroke-dasharray="6 6" />
    <text x="0" y="1" text-anchor="middle" dominant-baseline="central"
          font-family="Georgia, serif" font-style="italic" font-size="17" fill="#f2b55c">Gift?</text>
  </g>
</svg>
