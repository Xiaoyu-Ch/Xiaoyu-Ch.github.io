<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="A speech bubble with a voice waveform inside, next to a cost line that drops steeply.">
  <defs>
    <linearGradient id="muBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121d2e" />
      <stop offset="1" stop-color="#1d2a46" />
    </linearGradient>
  </defs>
  <rect width="600" height="280" fill="url(#muBg)" />

  <!-- speech bubble with a waveform in it -->
  <g>
    <rect x="42" y="56" width="248" height="134" rx="26" fill="#6fd6c4" />
    <path d="M86 188 L82 226 L124 188 Z" fill="#6fd6c4" />
    <g stroke="#10302c" stroke-width="7" stroke-linecap="round">
      <path d="M80 123 v17" />
      <path d="M102 108 v47" />
      <path d="M124 92 v79" />
      <path d="M146 114 v35" />
      <path d="M168 100 v63" />
      <path d="M190 118 v27" />
      <path d="M212 104 v55" />
      <path d="M234 120 v23" />
      <path d="M256 112 v39" />
    </g>
  </g>

  <!-- the cost curve that made the rewrite necessary -->
  <g>
    <line x1="340" y1="60" x2="340" y2="214" stroke="#6b7f99" stroke-width="2" />
    <line x1="340" y1="214" x2="566" y2="214" stroke="#6b7f99" stroke-width="2" />
    <path d="M352 82 C 402 92, 424 176, 470 196 S 536 204, 558 206"
          fill="none" stroke="#f2b55c" stroke-width="5" stroke-linecap="round" />
    <circle cx="352" cy="82" r="7" fill="#f2b55c" />
    <circle cx="558" cy="206" r="7" fill="#6fd6c4" />
    <text x="364" y="76" fill="#f0ede4" font-family="Roboto, system-ui, sans-serif" font-size="15" font-weight="600">realtime API</text>
    <text x="548" y="182" text-anchor="end" fill="#9fd0c8" font-family="Roboto, system-ui, sans-serif" font-size="14" font-weight="600">rebuilt pipeline</text>
    <text x="344" y="238" fill="#8da4b0" font-family="Roboto, system-ui, sans-serif" font-size="12" letter-spacing="1">COST PER MINUTE</text>
  </g>
</svg>
