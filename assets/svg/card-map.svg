<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="A stylised world map with a dotted route from East Asia to North America, linking four marked stops.">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a2b" />
      <stop offset="1" stop-color="#113f3c" />
    </linearGradient>
    <linearGradient id="mapRoute" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b55c" />
      <stop offset="1" stop-color="#6fd6c4" />
    </linearGradient>
  </defs>

  <rect width="600" height="280" fill="url(#mapBg)" />

  <!-- graticule -->
  <g fill="none" stroke="#9fd0dd" stroke-opacity="0.13" stroke-width="1.4">
    <line x1="0" y1="66" x2="600" y2="66" />
    <line x1="0" y1="132" x2="600" y2="132" />
    <line x1="0" y1="198" x2="600" y2="198" />
    <line x1="88" y1="0" x2="88" y2="280" />
    <line x1="176" y1="0" x2="176" y2="280" />
    <line x1="264" y1="0" x2="264" y2="280" />
    <line x1="352" y1="0" x2="352" y2="280" />
    <line x1="440" y1="0" x2="440" y2="280" />
    <line x1="528" y1="0" x2="528" y2="280" />
  </g>

  <!-- landmasses, drawn freehand as suggestions rather than traced outlines -->
  <g fill="#1f6159" fill-opacity="0.8" stroke="#44a394" stroke-opacity="0.45" stroke-width="2">
    <path d="M54 88 Q78 56 128 52 Q180 48 214 70 Q240 86 232 112 Q224 136 198 144
             Q192 172 184 200 Q180 220 170 210 Q168 180 172 152
             Q142 150 112 140 Q72 128 56 110 Q44 98 54 88 Z" />
    <path d="M396 72 Q436 48 488 54 Q544 60 560 88 Q572 110 550 130
             Q524 150 484 146 Q448 142 422 126 Q394 108 396 72 Z" />
    <path d="M572 104 Q584 122 578 146 Q573 164 562 170 Q568 144 566 124 Q565 112 572 104 Z" />
  </g>

  <!-- route, east to west -->
  <path d="M470 108 C 404 72, 332 90, 272 126 S 152 186, 112 158"
        fill="none" stroke="url(#mapRoute)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="12 13" />

  <!-- stops -->
  <g>
    <circle cx="470" cy="108" r="8.5" fill="#f6f2e8" />
    <circle cx="330" cy="98" r="6.5" fill="#f6f2e8" fill-opacity="0.9" />
    <circle cx="206" cy="166" r="6.5" fill="#f6f2e8" fill-opacity="0.9" />
    <g transform="translate(112 158)">
      <circle r="21" fill="none" stroke="#f2b55c" stroke-width="2.5" stroke-opacity="0.55" />
      <path d="M0 10 C -9 -2, -11 -8, -11 -12 A 11 11 0 1 1 11 -12 C 11 -8, 9 -2, 0 10 Z" fill="#f2b55c" />
      <circle cy="-12" r="4" fill="#0e1a2b" />
    </g>
  </g>

  <!-- compass rose -->
  <g transform="translate(550 236)" opacity="0.75">
    <circle r="20" fill="none" stroke="#9fd0dd" stroke-opacity="0.35" stroke-width="2" />
    <path d="M0 -17 L4.5 0 L0 17 L-4.5 0 Z" fill="#f6f2e8" />
    <path d="M-17 0 L0 -3.5 L17 0 L0 3.5 Z" fill="#6fd6c4" fill-opacity="0.7" />
  </g>
</svg>
