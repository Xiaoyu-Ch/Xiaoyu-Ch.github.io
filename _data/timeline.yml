# Hand-maintained news timeline.
#
# Rendered by _pages/about.md and _pages/news.md rather than by the theme's
# news.liquid, because that include prints `%b %d, %Y` and would invent a
# day-of-month for entries where only the month is known. Every `when` string
# below is written at the precision the source actually gives.
#
# Sources: shared/profile.yaml (education, experience_summary, publications).
# Do not add an entry whose date is not in one of Tom's own files.
# Order in this file is the display order: newest first. There is no sort key,
# because the entries have mixed precision and a sort key would have to invent one.

